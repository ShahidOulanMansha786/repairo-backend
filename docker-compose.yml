services:

  postgis:
    image: postgis/postgis:15-3.4
    container_name: repairo_postgres
    environment:
      POSTGRES_DB: repairo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: carrepair123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: repairo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
